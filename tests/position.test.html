<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>position.js tests</title>
  <style>
    body { font: 15px/1.5 monospace; margin: 16px; }
    .pass { color: #1a7f37; }
    .fail { color: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .pass { color: #4ac26b; }
      .fail { color: #ff7b72; }
    }
    pre { margin: 0 0 0 3em; white-space: pre-wrap; }
    #boards { display: none; }
  </style>
</head>
<body>
<h1>position.js tests</h1>
<p id="summary">Running…</p>
<ul id="results"></ul>
<div id="boards"></div>

<script src="../src/position.js"></script>
<script>
"use strict";

/*
 * Tests for src/position.js. Open this file in Firefox to run them.
 *
 * Instead of saved copies of the site's page, the tests build small boards
 * with the same structure as the site's HTML (see the sample files in the
 * project root). Only the parts the reader uses are built: the board
 * container, the piece wrappers (id, transform, img alt) and the rank labels.
 * If the site changes its HTML, update makeBoard to match.
 */

// ---------------------------------------------------------------- test runner

const results = [];

function test(name, fn) {
  try {
    fn();
    results.push({ name, ok: true });
  } catch (error) {
    results.push({ name, ok: false, message: error.message });
  }
}

/** Compares as JSON, ignoring the order of object keys. */
function assertEqual(actual, expected) {
  const canonical = (value) =>
    JSON.stringify(value, (key, x) =>
      x && typeof x === "object" && !Array.isArray(x)
        ? Object.fromEntries(Object.entries(x).sort())
        : x);
  if (canonical(actual) !== canonical(expected)) {
    throw new Error(`expected ${canonical(expected)}\n     got ${canonical(actual)}`);
  }
}

/** Checks that fn throws exactly errorType (not a subclass) with this message. */
function assertThrows(fn, errorType, message) {
  const expected = `${errorType.name}: ${message}`;
  try {
    fn();
  } catch (error) {
    if (error.constructor === errorType && error.message === message) return;
    throw new Error(`expected ${expected}\n     got ${error.name}: ${error.message}`);
  }
  throw new Error(`expected ${expected}\n     got no error`);
}

function showResults() {
  const list = document.getElementById("results");
  for (const r of results) {
    const item = document.createElement("li");
    item.className = r.ok ? "pass" : "fail";
    item.textContent = `${r.ok ? "PASS" : "FAIL"}  ${r.name}`;
    if (!r.ok) {
      const details = document.createElement("pre");
      details.textContent = r.message;
      item.append(details);
      console.error("FAIL", r.name, "\n" + r.message);
    }
    list.append(item);
  }
  const passed = results.filter((r) => r.ok).length;
  const summary = `${passed} of ${results.length} tests passed`;
  document.getElementById("summary").textContent = summary;
  document.getElementById("summary").className = passed === results.length ? "pass" : "fail";
  document.title = (passed === results.length ? "PASS " : "FAIL ") + summary;
}

// -------------------------------------------------------------- board builder

/** "e4" -> { row: 4, col: 4 }  (row 0 = rank 8, col 0 = a-file, like the site's ids) */
function square(name) {
  return { row: 8 - Number(name[1]), col: "abcdefgh".indexOf(name[0]) };
}

/** "e4" -> "44", the id the site gives a piece on that square. */
function idOf(name) {
  const { row, col } = square(name);
  return `${row}${col}`;
}

function div(className) {
  const el = document.createElement("div");
  el.className = className;
  return el;
}

/** One piece wrapper, as the site draws it. */
function makePiece(letter, { row, col }, orientation, removed = false) {
  // Seen from Black's side the board is rotated 180°.
  const screen = orientation === "black" ? { x: 7 - col, y: 7 - row } : { x: col, y: row };
  const wrapper = div("ChessBoard_pieceWrapper__m95pT" + (removed ? " ChessBoard_removed__kaYG3" : ""));
  wrapper.id = `${row}${col}`;
  wrapper.style.transform = `translate(${screen.x * 100}%, ${screen.y * 100}%)`;
  const piece = div("piece_piece__JbwmA");
  const img = document.createElement("img");
  img.alt = letter;
  img.className = "piece_image__sXVkQ";
  piece.append(img);
  wrapper.append(piece);
  return wrapper;
}

/**
 * Builds a board showing a FEN piece placement.
 *   orientation: "white" or "black", the side at the bottom
 *   labels:      false to leave out the rank labels
 *   captured:    captured pieces the site keeps hidden, e.g. [{ letter: "P", on: "d4" }]
 */
function makeBoard(placement, { orientation = "white", labels = true, captured = [] } = {}) {
  const container = div("ChessBoard_relative__3gr96");
  const helper = div("ChessBoard_dimensionHelper__j_WGx");
  const board = div("flex-column ChessBoard_board__Vgpvk");

  placement.split("/").forEach((rank, row) => {
    let col = 0;
    for (const ch of rank) {
      if (/\d/.test(ch)) {
        col += Number(ch);
      } else {
        board.append(makePiece(ch, { row, col }, orientation));
        col++;
      }
    }
  });
  for (const c of captured) {
    board.append(makePiece(c.letter, square(c.on), orientation, true));
  }

  helper.append(board);
  if (labels) {
    const legend = div("flex-vertical-spaced ChessBoard_legend__bOKws ChessBoard_rank__y3XGp");
    const ranks = orientation === "black" ? "12345678" : "87654321";
    for (const r of ranks) {
      const label = div("ChessBoard_rankNumber__YLkVg");
      label.textContent = r;
      legend.append(label);
    }
    helper.append(legend);
  }
  container.append(helper);
  document.getElementById("boards").append(container);
  return container;
}

/** The piece wrapper on a square (looked up by its id). */
function pieceOn(board, name) {
  return board.querySelector(`[id="${idOf(name)}"]:not([class*="ChessBoard_removed"])`);
}

const read = (board) => ChessNotesPosition.readBoard(board);
const { internals } = ChessNotesPosition;

// ------------------------------------------------------------------ positions

const START = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR";
const AFTER_E4 = "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR";
const AFTER_E4_E5 = "rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR";
// Advance Caro-Kann after 1.e4 e6 2.d4 d5 3.e5 c5 4.c3 Nc6 5.Nf3 cxd4 6.cxd4.
// The pawns captured on d4 stay in the page, hidden (see capture.html).
const AFTER_CAPTURES = "r1bqkbnr/pp2pppp/2n5/3pP3/3P4/5N2/PP3PPP/RNBQKB1R";
const CAPTURED_ON_D4 = [{ letter: "P", on: "d4" }, { letter: "p", on: "d4" }];

const UNSURE = { ok: false, reason: "can't tell which way up the board is" };

// ---------------------------------------------------------------------- tests

test("findBoards finds the board container", () => {
  const board = makeBoard(START);
  const found = ChessNotesPosition.findBoards(document.getElementById("boards"));
  assertEqual(found.includes(board), true);
});

test("starting position, White at bottom", () => {
  assertEqual(read(makeBoard(START)), { ok: true, placement: START, orientation: "white" });
});

test("after 1.e4 e5, White at bottom", () => {
  assertEqual(read(makeBoard(AFTER_E4_E5)), { ok: true, placement: AFTER_E4_E5, orientation: "white" });
});

test("after 1.e4, Black at bottom", () => {
  const board = makeBoard(AFTER_E4, { orientation: "black" });
  assertEqual(read(board), { ok: true, placement: AFTER_E4, orientation: "black" });
});

test("captured pieces are skipped", () => {
  const board = makeBoard(AFTER_CAPTURES, { orientation: "black", captured: CAPTURED_ON_D4 });
  assertEqual(read(board), { ok: true, placement: AFTER_CAPTURES, orientation: "black" });
});

// Rank labels hidden: orientation has to come from the ids.

test("no labels: after 1.e4 e5, White at bottom", () => {
  const board = makeBoard(AFTER_E4_E5, { labels: false });
  assertEqual(read(board), { ok: true, placement: AFTER_E4_E5, orientation: "white" });
});

test("no labels: after 1.e4, Black at bottom", () => {
  const board = makeBoard(AFTER_E4, { orientation: "black", labels: false });
  assertEqual(read(board), { ok: true, placement: AFTER_E4, orientation: "black" });
});

test("no labels: captured pieces are skipped", () => {
  const board = makeBoard(AFTER_CAPTURES, { orientation: "black", labels: false, captured: CAPTURED_ON_D4 });
  assertEqual(read(board), { ok: true, placement: AFTER_CAPTURES, orientation: "black" });
});

// Every piece must agree on the orientation.

test("no labels: one piece disagrees (White at bottom)", () => {
  const board = makeBoard(AFTER_E4_E5, { labels: false });
  // The e4 pawn is drawn where d5 would be if Black were at the bottom.
  pieceOn(board, "e4").id = idOf("d5");
  assertEqual(read(board), UNSURE);
});

test("no labels: one piece disagrees (Black at bottom)", () => {
  const board = makeBoard(AFTER_E4, { orientation: "black", labels: false });
  // The e4 pawn is drawn where d5 would be if White were at the bottom.
  pieceOn(board, "e4").id = idOf("d5");
  assertEqual(read(board), UNSURE);
});

test("no labels: one piece fits neither side (White at bottom)", () => {
  const board = makeBoard(AFTER_E4_E5, { labels: false });
  pieceOn(board, "e4").id = idOf("e2");
  assertEqual(read(board), UNSURE);
});

test("no labels: one piece fits neither side (Black at bottom)", () => {
  const board = makeBoard(AFTER_E4, { orientation: "black", labels: false });
  pieceOn(board, "e4").id = idOf("e2");
  assertEqual(read(board), UNSURE);
});

test("labels present: a piece whose id disagrees is caught by the id check", () => {
  const board = makeBoard(AFTER_E4_E5);
  pieceOn(board, "e4").id = idOf("d5");
  assertEqual(read(board), { ok: false, reason: "piece P is drawn on e4 but its id says d5" });
});

// Boards that can't be read yet.

test("a piece between squares is rejected", () => {
  const board = makeBoard(AFTER_E4_E5);
  pieceOn(board, "e4").style.transform = "translate(400%, 450%)";
  assertEqual(read(board), { ok: false, reason: "piece P is between squares (translate(400%, 450%))" });
});

test("two pieces on one square are rejected", () => {
  const board = makeBoard(AFTER_E4_E5);
  const blackPawn = pieceOn(board, "e5");
  blackPawn.removeAttribute("id");
  blackPawn.style.transform = "translate(400%, 400%)"; // drawn on e4
  assertEqual(read(board), { ok: false, reason: "two pieces on e4" });
});

test("an empty board is rejected", () => {
  assertEqual(read(makeBoard("8/8/8/8/8/8/8/8")), { ok: false, reason: "no pieces found" });
});

test("an unknown piece letter is rejected", () => {
  const board = makeBoard(AFTER_E4_E5);
  pieceOn(board, "e4").querySelector("img").alt = "X";
  assertEqual(read(board), { ok: false, reason: `unknown piece "X" (id ${idOf("e4")})` });
});

// ------------------------------------------------- orientationFromLabels (unit)

// Reads the top rank label.

test('orientationFromLabels: labels "8", "7" → "white"', () => {
  const board = document.createElement("div");
  board.innerHTML = `
    <div class="ChessBoard_rankNumber__YLkVg">8</div>
    <div class="ChessBoard_rankNumber__YLkVg">7</div>`;
  assertEqual(internals.orientationFromLabels(board), "white");
});

test('orientationFromLabels: labels "1", "2" → "black"', () => {
  const board = document.createElement("div");
  board.innerHTML = `
    <div class="ChessBoard_rankNumber__YLkVg">1</div>
    <div class="ChessBoard_rankNumber__YLkVg">2</div>`;
  assertEqual(internals.orientationFromLabels(board), "black");
});

test('orientationFromLabels: whitespace around the label is ignored ("\\n    8\\n  ", "7" → "white")', () => {
  const board = document.createElement("div");
  // Laid out like the real page, with the number on its own line.
  board.innerHTML = `
    <div class="ChessBoard_rankNumber__YLkVg">
    8
  </div>
    <div class="ChessBoard_rankNumber__YLkVg">7</div>`;
  assertEqual(internals.orientationFromLabels(board), "white");
});

// Returns null when the labels don't say.

test("orientationFromLabels: no labels (an empty container) → null", () => {
  const board = document.createElement("div");
  assertEqual(internals.orientationFromLabels(board), null);
});

test('orientationFromLabels: top label is not "8" or "1" ("4", "8" → null)', () => {
  const board = document.createElement("div");
  board.innerHTML = `
    <div class="ChessBoard_rankNumber__YLkVg">4</div>
    <div class="ChessBoard_rankNumber__YLkVg">8</div>`;
  assertEqual(internals.orientationFromLabels(board), null);
});

// ---------------------------------------------------- orientationFromIds (unit)

// Only idSquare and screen are read. Squares are { row, col } with row 0 = rank 8
// and col 0 = the a-file; screen is counted from the top-left of the board as shown.

// Returns the side when every piece agrees.

test('orientationFromIds: every piece fits White at bottom → "white"', () => {
  const pieces = [
    { idSquare: { row: 6, col: 4 }, screen: { row: 6, col: 4 } }, // e2
    { idSquare: { row: 0, col: 1 }, screen: { row: 0, col: 1 } }, // b8
  ];
  assertEqual(internals.orientationFromIds(pieces), "white");
});

test('orientationFromIds: every piece fits Black at bottom → "black"', () => {
  const pieces = [
    { idSquare: { row: 4, col: 4 }, screen: { row: 3, col: 3 } }, // e4
    { idSquare: { row: 7, col: 6 }, screen: { row: 0, col: 1 } }, // g1
  ];
  assertEqual(internals.orientationFromIds(pieces), "black");
});

test('orientationFromIds: pieces with no id or no screen square are skipped → "black"', () => {
  const pieces = [
    { idSquare: null, screen: { row: 2, col: 2 } },
    { idSquare: { row: 3, col: 6 }, screen: null },
    { idSquare: { row: 7, col: 0 }, screen: { row: 0, col: 7 } }, // a1
  ];
  assertEqual(internals.orientationFromIds(pieces), "black");
});

// Returns null when it can't tell.

test("orientationFromIds: two pieces disagree → null", () => {
  const pieces = [
    { idSquare: { row: 1, col: 3 }, screen: { row: 1, col: 3 } }, // d7, fits White
    { idSquare: { row: 5, col: 2 }, screen: { row: 2, col: 5 } }, // c3, fits Black
  ];
  assertEqual(internals.orientationFromIds(pieces), null);
});

test("orientationFromIds: a piece fits neither side as the first piece → null", () => {
  const pieces = [
    { idSquare: { row: 7, col: 7 }, screen: { row: 6, col: 7 } }, // h1, fits neither
    { idSquare: { row: 6, col: 0 }, screen: { row: 6, col: 0 } }, // a2, fits White
  ];
  assertEqual(internals.orientationFromIds(pieces), null);
});

test("orientationFromIds: a piece fits neither side as the second piece → null", () => {
  const pieces = [
    { idSquare: { row: 7, col: 1 }, screen: { row: 7, col: 1 } }, // b1, fits White
    { idSquare: { row: 2, col: 5 }, screen: { row: 2, col: 4 } }, // f6, fits neither
  ];
  assertEqual(internals.orientationFromIds(pieces), null);
});

test("orientationFromIds: no usable pieces → null", () => {
  const pieces = [
    { idSquare: null, screen: { row: 5, col: 5 } },
  ];
  assertEqual(internals.orientationFromIds(pieces), null);
});

// ----------------------------------------------------- parseScreenSquare (unit)

// Reads a square from the transform.

test("parseScreenSquare: translate(400%, 300%) → row 3, col 4", () => {
  const el = document.createElement("div");
  el.style.transform = "translate(400%, 300%)";
  assertEqual(internals.parseScreenSquare(el), { row: 3, col: 4 });
});

test("parseScreenSquare: the far corner squares count: translate(700%, 0%) → row 0, col 7", () => {
  const el = document.createElement("div");
  el.style.transform = "translate(700%, 0%)";
  assertEqual(internals.parseScreenSquare(el), { row: 0, col: 7 });
});

// Returns null when the piece isn't on a square.

test("parseScreenSquare: between squares: translate(450%, 200%) → null", () => {
  const el = document.createElement("div");
  el.style.transform = "translate(450%, 200%)";
  assertEqual(internals.parseScreenSquare(el), null);
});

test("parseScreenSquare: off the right edge: translate(800%, 100%) → null", () => {
  const el = document.createElement("div");
  el.style.transform = "translate(800%, 100%)";
  assertEqual(internals.parseScreenSquare(el), null);
});

test("parseScreenSquare: off the top edge: translate(600%, -100%) → null", () => {
  const el = document.createElement("div");
  el.style.transform = "translate(600%, -100%)";
  assertEqual(internals.parseScreenSquare(el), null);
});

test("parseScreenSquare: no transform: an element with no style → null", () => {
  const el = document.createElement("div");
  assertEqual(internals.parseScreenSquare(el), null);
});

// --------------------------------------------------------- parseIdSquare (unit)

// Reads a square from the id.

test('parseIdSquare: "44" → row 4, col 4', () => {
  const el = document.createElement("div");
  el.id = "44";
  assertEqual(internals.parseIdSquare(el), { row: 4, col: 4 });
});

// Returns null for other ids.

for (const [label, id] of [
  ["empty", ""],
  ["a letter", "8a"],
  ["three digits", "123"],
  ["a digit past 7", "09"],
]) {
  test(`parseIdSquare: ${label}: "${id}" → null`, () => {
    const el = document.createElement("div");
    el.id = id;
    assertEqual(internals.parseIdSquare(el), null);
  });
}

// ------------------------------------------------------------ squareName (unit)

// Names a square.

for (const [name, square] of [
  ["a8", { row: 0, col: 0 }],
  ["h1", { row: 7, col: 7 }],
  ["e4", { row: 4, col: 4 }],
]) {
  test(`squareName: row ${square.row}, col ${square.col} → "${name}"`, () => {
    assertEqual(internals.squareName(square), name);
  });
}

// Throws unless row and col are both whole numbers 0–7.

for (const [label, square, message] of [
  ["row past 7", { row: 8, col: 2 }, "row must be a whole number from 0 to 7, got 8"],
  ["row below 0", { row: -1, col: 5 }, "row must be a whole number from 0 to 7, got -1"],
  ["col past 7", { row: 3, col: 8 }, "col must be a whole number from 0 to 7, got 8"],
  ["col below 0", { row: 6, col: -1 }, "col must be a whole number from 0 to 7, got -1"],
]) {
  test(`squareName: off the board: ${label} → RangeError`, () => {
    assertThrows(() => internals.squareName(square), RangeError, message);
  });
}

for (const [label, square, message] of [
  ["row", { row: 2.5, col: 3 }, "row must be a whole number from 0 to 7, got 2.5"],
  ["col", { row: 1, col: 6.5 }, "col must be a whole number from 0 to 7, got 6.5"],
]) {
  test(`squareName: between squares: ${label} not whole → RangeError`, () => {
    assertThrows(() => internals.squareName(square), RangeError, message);
  });
}

for (const [label, square, message] of [
  ["a string row", { row: "4", col: 0 }, 'row must be a number, got "4"'],
  ["no col", { row: 7 }, "col must be a number, got undefined"],
  ["null in place of the square", null, "squareName needs a square like { row, col }, got null"],
]) {
  test(`squareName: not a number: ${label} → TypeError`, () => {
    assertThrows(() => internals.squareName(square), TypeError, message);
  });
}

// ----------------------------------------------------------- toPlacement (unit)

/** An 8x8 grid from one string per rank, rank 8 first, "." for an empty square. */
function grid(ranks) {
  return ranks.map((rank) => [...rank].map((c) => (c === "." ? null : c)));
}

// Turns a grid into FEN piece placement.

test('toPlacement: empty grid → "8/8/8/8/8/8/8/8"', () => {
  const empty = grid([
    "........",
    "........",
    "........",
    "........",
    "........",
    "........",
    "........",
    "........",
  ]);
  assertEqual(internals.toPlacement(empty), "8/8/8/8/8/8/8/8");
});

test("toPlacement: grid full of pawns, Black's on ranks 8–5 and White's on 4–1", () => {
  const pawns = grid([
    "pppppppp",
    "pppppppp",
    "pppppppp",
    "pppppppp",
    "PPPPPPPP",
    "PPPPPPPP",
    "PPPPPPPP",
    "PPPPPPPP",
  ]);
  assertEqual(
    internals.toPlacement(pawns),
    "pppppppp/pppppppp/pppppppp/pppppppp/PPPPPPPP/PPPPPPPP/PPPPPPPP/PPPPPPPP",
  );
});

test("toPlacement: starting grid → starting placement", () => {
  const start = grid([
    "rnbqkbnr",
    "pppppppp",
    "........",
    "........",
    "........",
    "........",
    "PPPPPPPP",
    "RNBQKBNR",
  ]);
  assertEqual(internals.toPlacement(start), START);
});

test("toPlacement: grid after 1.e4 → placement after 1.e4", () => {
  const afterE4 = grid([
    "rnbqkbnr",
    "pppppppp",
    "........",
    "........",
    "....P...",
    "........",
    "PPPP.PPP",
    "RNBQKBNR",
  ]);
  assertEqual(internals.toPlacement(afterE4), AFTER_E4);
});

test("toPlacement: grid after 1.e4 e5 → placement after 1.e4 e5", () => {
  const afterE4E5 = grid([
    "rnbqkbnr",
    "pppp.ppp",
    "........",
    "....p...",
    "....P...",
    "........",
    "PPPP.PPP",
    "RNBQKBNR",
  ]);
  assertEqual(internals.toPlacement(afterE4E5), AFTER_E4_E5);
});

// Throws unless the grid is 8 rows of 8 cells, each a piece letter or null.

test("toPlacement: 7 rows → RangeError", () => {
  const short = grid([
    "r...k..r",
    "pppppppp",
    "........",
    "........",
    "........",
    "PPPPPPPP",
    "R...K..R",
  ]);
  assertThrows(() => internals.toPlacement(short), RangeError, "grid must have 8 rows, got 7");
});

test("toPlacement: 9 rows → RangeError", () => {
  const long = grid([
    "....k...",
    "........",
    "...q....",
    "........",
    "........",
    "........",
    "..N.....",
    "........",
    "......K.",
  ]);
  assertThrows(() => internals.toPlacement(long), RangeError, "grid must have 8 rows, got 9");
});

test("toPlacement: row 3 of 9 squares → RangeError", () => {
  const wide = grid([
    "r.bqkb.r",
    "pp..pppp",
    "..n..n..",
    "..pp.....",
    "...P....",
    "..N..N..",
    "PPP.PPPP",
    "R.BQKB.R",
  ]);
  assertThrows(() => internals.toPlacement(wide), RangeError, "row 3 must have 8 squares, got 9");
});

test('toPlacement: unknown letter "X" → RangeError', () => {
  const unknown = grid([
    "rnbqkbnr",
    "pppppppp",
    ".....X..",
    "........",
    "........",
    "........",
    "PPPPPPPP",
    "RNBQKBNR",
  ]);
  assertThrows(
    () => internals.toPlacement(unknown),
    RangeError,
    'row 2, col 5 must be a FEN piece letter or null, got "X"',
  );
});

test("toPlacement: undefined at row 6, col 1 → RangeError", () => {
  const hole = grid([
    "...k....",
    "........",
    "........",
    "........",
    "........",
    "........",
    "........",
    "...K....",
  ]);
  hole[6][1] = undefined;
  assertThrows(
    () => internals.toPlacement(hole),
    RangeError,
    "row 6, col 1 must be a FEN piece letter or null, got undefined",
  );
});

test("toPlacement: null in place of the grid → TypeError", () => {
  assertThrows(
    () => internals.toPlacement(null),
    TypeError,
    "grid must be an array of 8 rows, got null",
  );
});

test('toPlacement: row 4 is the string "8" → TypeError', () => {
  const stringRow = grid([

    "..NBPN..",
    "PPP..PPP",
    "R..QK..R",
  ]);

});
